name: salamti
description: Salamti - Your Safety, Always Connected

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    
  google_fonts: ^6.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  provider: ^6.1.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.3
  file_picker: ^8.0.0+1
  path: ^1.9.0
  google_maps_flutter: ^2.5.3
  geolocator: ^12.0.0
  flutter_secure_storage: ^9.0.0
  http: ^1.2.0
  http_parser: ^4.0.2
  google_sign_in: ^7.2.0
  device_info_plus: ^10.1.0
  uuid: ^4.3.3
  firebase_core: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
